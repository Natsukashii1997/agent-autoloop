name: check
on:
  push:
    branches: [main]
  pull_request:
  # Pushes and pull requests check on Linux only. macOS bills ten Linux minutes for one, so it runs when asked for here.
  workflow_dispatch:
    inputs:
      os:
        description: 在哪个系统上检查（macOS 只在这里手动选）
        type: choice
        options: [ubuntu-latest, macos-latest]
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a PR makes its run pointless. On main a run covers everything before it, so it finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      matrix:
        os: ["${{ inputs.os || 'ubuntu-latest' }}"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # These jobs stay required on main, so a docs change runs them too and they pass without doing anything.
      - id: scope
        shell: bash
        run: sh scripts/ci-scope.sh >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.scope != 'docs'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.scope.outputs.scope != 'docs'
        run: npm ci
      - if: steps.scope.outputs.scope != 'docs'
        run: npm run format:check
      - if: steps.scope.outputs.scope != 'docs'
        run: npm run typecheck
      # The long simulation runs the same kernel on any system, so macOS gets the quick tests even when asked for everything.
      - if: steps.scope.outputs.scope == 'normal' || steps.scope.outputs.scope == 'kernel' || (runner.os == 'macOS' && steps.scope.outputs.scope == 'full')
        run: npm run test:quick
      - if: steps.scope.outputs.scope == 'kernel'
        run: npm run test:sim
      - if: runner.os != 'macOS' && steps.scope.outputs.scope == 'full'
        run: npm test
      - if: steps.scope.outputs.scope != 'docs'
        run: sh scripts/install-smoke.sh
